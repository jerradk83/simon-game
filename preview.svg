<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </radialGradient>

    <!-- Quadrant Gradients -->
    <radialGradient id="greenGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#00ff73"/>
      <stop offset="100%" stop-color="#006934"/>
    </radialGradient>
    <radialGradient id="redGrad" cx="70%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff3b59"/>
      <stop offset="100%" stop-color="#800c1e"/>
    </radialGradient>
    <radialGradient id="yellowGrad" cx="30%" cy="70%" r="70%">
      <stop offset="0%" stop-color="#ffea00"/>
      <stop offset="100%" stop-color="#8a6700"/>
    </radialGradient>
    <radialGradient id="blueGrad" cx="70%" cy="70%" r="70%">
      <stop offset="0%" stop-color="#00b0ff"/>
      <stop offset="100%" stop-color="#064789"/>
    </radialGradient>

    <!-- Console Shadows & Filters -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.8"/>
    </filter>
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>

  <!-- Subtle Grid Pattern -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M0 250 H800 M0 300 H800 M0 350 H800 M0 400 H800 M0 450 H800"/>
    <path d="M50 0 V500 M100 0 V500 M150 0 V500 M200 0 V500 M250 0 V500 M300 0 V500 M350 0 V500 M400 0 V500 M450 0 V500 M500 0 V500 M550 0 V500 M600 0 V500 M650 0 V500 M700 0 V500 M750 0 V500"/>
  </g>

  <!-- Header Title -->
  <text x="400" y="55" font-family="'Orbitron', -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="8" text-anchor="middle">
    <tspan fill="#00ff73">S</tspan><tspan fill="#ff3b59">I</tspan><tspan fill="#ffea00">M</tspan><tspan fill="#00b0ff">O</tspan><tspan fill="#ffffff">N</tspan>
  </text>
  <text x="400" y="80" font-family="'Rajdhani', sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#8391a7" text-anchor="middle">
    LIGHT &amp; SOUND MEMORY CHALLENGE
  </text>

  <!-- Simon Outer Chassis -->
  <g transform="translate(400, 280)">
    <!-- Main base -->
    <circle r="185" fill="#141824" filter="url(#shadow)"/>
    <circle r="175" fill="#1d2333" stroke="#2c364d" stroke-width="2"/>

    <!-- Green Pad (Top Left) -->
    <path d="M -8 -8 L -8 -160 A 152 152 0 0 0 -160 -8 Z" fill="url(#greenGrad)" rx="6"/>
    <!-- Red Pad (Top Right) -->
    <path d="M 8 -8 L 160 -8 A 152 152 0 0 0 8 -160 Z" fill="url(#redGrad)" rx="6"/>
    <!-- Yellow Pad (Bottom Left) -->
    <path d="M -8 8 L -160 8 A 152 152 0 0 0 -8 160 Z" fill="url(#yellowGrad)" rx="6"/>
    <!-- Blue Pad (Bottom Right) -->
    <path d="M 8 8 L 8 160 A 152 152 0 0 0 160 8 Z" fill="url(#blueGrad)" rx="6"/>

    <!-- Center Console Hub -->
    <circle r="72" fill="#141824" stroke="#1d2333" stroke-width="5" filter="url(#shadow)"/>
    <circle r="65" fill="#0f121a" stroke="#252d40" stroke-width="2"/>

    <!-- Console Branding -->
    <text x="0" y="-22" font-family="'Orbitron', sans-serif" font-size="16" font-weight="900" letter-spacing="3" fill="#ffffff" text-anchor="middle">SIMON</text>

    <!-- Status Badge -->
    <rect x="-42" y="-10" width="84" height="18" rx="9" fill="#162030" stroke="#00d2ff" stroke-width="1"/>
    <text x="0" y="3" font-family="'Rajdhani', sans-serif" font-size="10" font-weight="700" fill="#00d2ff" letter-spacing="1" text-anchor="middle">YOUR TURN</text>

    <!-- Start Button -->
    <rect x="-35" y="15" width="70" height="22" rx="11" fill="linear-gradient(#2f3950, #1b212f)" stroke="#3f4d6d" stroke-width="1.5"/>
    <text x="0" y="30" font-family="'Orbitron', sans-serif" font-size="9" font-weight="800" fill="#ffffff" letter-spacing="1" text-anchor="middle">START</text>
  </g>

  <!-- Left Stats Card Preview -->
  <g transform="translate(140, 160)">
    <rect width="110" height="60" rx="10" fill="#151a24" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="55" y="20" font-family="'Rajdhani', sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#8391a7" text-anchor="middle">ROUND</text>
    <rect x="30" y="27" width="50" height="24" rx="4" fill="#000" stroke="#ff3b30" stroke-width="0.8"/>
    <text x="55" y="44" font-family="'Press Start 2P', monospace" font-size="14" fill="#ff3b30" text-anchor="middle">08</text>
  </g>

  <!-- Right Stats Card Preview -->
  <g transform="translate(550, 160)">
    <rect width="110" height="60" rx="10" fill="#151a24" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="55" y="20" font-family="'Rajdhani', sans-serif" font-size="10" font-weight="700" letter-spacing="1" fill="#8391a7" text-anchor="middle">HIGH SCORE</text>
    <rect x="30" y="27" width="50" height="24" rx="4" fill="#000" stroke="#ff3b30" stroke-width="0.8"/>
    <text x="55" y="44" font-family="'Press Start 2P', monospace" font-size="14" fill="#ff3b30" text-anchor="middle">14</text>
  </g>

  <!-- Badge / URL Footer -->
  <text x="400" y="480" font-family="'Rajdhani', sans-serif" font-size="14" font-weight="600" fill="#00d2ff" letter-spacing="1" text-anchor="middle">
    https://jerradk83.github.io/simon-game/
  </text>
</svg>
